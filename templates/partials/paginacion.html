{% if page_obj.has_other_pages %}
<div class="flex flex-wrap items-center justify-between gap-3 border-t p-4 text-sm">
    <span class="text-slate-500">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    <div class="flex gap-2">
        {% if page_obj.has_previous %}<a class="btn-secondary" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}
        {% if page_obj.has_next %}<a class="btn-secondary" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}">Siguiente</a>{% endif %}
    </div>
</div>
{% endif %}
